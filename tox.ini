# This file provides configurations for tox-based project development and management automation tasks.

# Base tox configurations. Note, the 'envlist' runs in the listed order whenever 'tox' is used without an -e specifier.
[tox]
requires =
    tox>=4,<5
    tox-uv>=1,<2
envlist =
    uninstall
    export
    lint
    stubs
    {py312}-test
    coverage
    docs
    build
    install

# Note: The 'basepython' argument should always be set to the earliest (and, for this single-version project, the only)
# supported Python version. Every environment that installs the project sets it, because the 'requires-python' bound in
# pyproject.toml admits no other interpreter and the DeepLabCut dependency tree resolves for no other one. The
# 'skip_install' environments run under any interpreter and leave it unset. The 'ruff check' command also covers the
# test directory, which activates the 'tests/**/*.py' per-file ignores configured in the pyproject.toml file. The 'mypy'
# command stays on the source directory, as the test directory is part of the mypy exclusion list.
#
# The 'lint', 'stubs', and '{py312}-test' environments install their development toolchain through a classic 'deps'
# list rather than the PEP 735 'dependency_groups = dev' used by the sibling libraries. DeepLabCut's dependency tree
# caps tox at 4.20 in this project's environment, and tox only gained 'dependency_groups' support in 4.22. The
# 'ataraxis-automation' distribution pulls in the same test, lint, and documentation toolchain the 'dev' group
# provides, matching the 'deps' already used by the remaining environments in this file.
[testenv:lint]
description =
    Runs static code formatting, style, and typing checkers. Follows the configuration defined in the pyproject.toml
    file.
deps =
    ataraxis-automation==9.0.2
    pandas-stubs>=2,<3
    types-psutil>=7,<8
basepython = py312
commands =
    automation-cli purge-stubs
    ruff format
    ruff check --fix ./src ./tests
    mypy ./src

# Note: the import command ahead of stubgen writes the bytecode cache for the torch and DeepLabCut chain the package
# pulls in. Stubgen introspects the package inside a subprocess that mypy abandons after a hard-coded 30 second wait,
# and the first import in a freshly created environment compiles that whole chain from source, which overruns the wait.
# The warm-up command carries no such deadline, so it absorbs the compilation and hands stubgen a cached import.
[testenv:stubs]
description = Generates the py.typed marker and the .pyi stub files using the project's wheel distribution.
depends = lint
deps = ataraxis-automation==9.0.2
basepython = py312
commands =
    automation-cli process-typed-markers
    python -c "import sollertia_video_tracking"
    stubgen -o stubs --include-private -p sollertia_video_tracking -v
    automation-cli process-stubs
    ruff format
    ruff check --select I --fix ./src

[testenv:{py312}-test]
package = wheel
description =
    Runs unit and integration tests for the python version listed in the task name and aggregates test coverage data.
    Uses 'loadgroup' balancing and all logical cores to optimize task runtime speed.
deps = ataraxis-automation==9.0.2
setenv = COVERAGE_FILE = reports{/}.coverage.{envname}
commands =
    pytest --import-mode=importlib --cov=sollertia_video_tracking --cov-config=pyproject.toml \
    --cov-report=xml --junitxml=reports/pytest.xml.{envname} -n logical --dist loadgroup

# Note: the 'xml' and 'html' commands run with '--fail-under=0' so that both reports are always written, the html
# report to the 'reports' directory and the xml report to the project root. The trailing 'report' command applies the
# 100% coverage gate configured in the pyproject.toml file and prints the statements that remain uncovered. Every
# reporting command also combines any data files it finds, so all of them run with '--keep-combined' to preserve the
# per-environment data file the test task writes. Without the flag, the first reporting command deletes that file and
# the commands after it report on the combined record alone.
[testenv:coverage]
skip_install = true
description =
    Combines the test-coverage data produced by the test run into a single html file and verifies that the combined
    data covers 100% of the measured statements. The file can be viewed by loading the
    'reports/coverage_html/index.html'. The task also merges the JUnit test-result report into 'reports/pytest.xml' and
    writes an xml coverage report to the project root.
deps = ataraxis-automation==9.0.2
setenv = COVERAGE_FILE = reports/.coverage
depends = {py312}-test
commands =
    junitparser merge --glob reports/pytest.xml.* reports/pytest.xml
    coverage combine --keep
    coverage xml --fail-under=0 --keep-combined
    coverage html --fail-under=0 --keep-combined
    coverage report --keep-combined

[testenv:docs]
description =
    Builds the API documentation from source code docstrings using Sphinx. The result can be viewed by loading
    'docs/build/html/index.html'.
deps = ataraxis-automation==9.0.2
depends = uninstall
basepython = py312
commands =
    sphinx-build -b html -d docs/build/doctrees docs/source docs/build/html -j auto -v

[testenv:build]
skip_install = true
description =
    Builds the project's source code distribution (sdist) and binary distribution (wheel), clearing the 'dist'
    directory beforehand so that artifacts built for an earlier version cannot be carried into the upload task.
deps = ataraxis-automation==9.0.2
allowlist_externals = docker
commands =
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -m build . --sdist
    python -m build . --wheel

# Note: use 'tox -e upload -- --replace-token' command to replace the token stored in the shared .pypirc file before
# uploading the project.
[testenv:upload]
skip_install = true
description =
    Uses twine to upload the wheel ('*.whl') and source ('*.tar.gz') distributions found inside the project's 'dist'
    directory to PyPI.
deps = ataraxis-automation==9.0.2
commands =
    automation-cli acquire-pypi-token {posargs:}
    automation-cli upload-project

# Note: use 'tox -e deploy -- --replace-token' command to replace the token stored in the shared .netlifyrc file, and
# 'tox -e deploy -- --replace-site' to replace the site identifier stored in the project's .netlify-site file, before
# deploying the documentation.
[testenv:deploy]
skip_install = true
description =
    Uploads the API documentation built by the 'docs' task to the project's Netlify site. Build the documentation with
    'tox -e docs' before calling this task.
deps = ataraxis-automation==9.0.2
commands =
    automation-cli acquire-netlify-token {posargs:}
    automation-cli deploy-docs

[testenv:install]
skip_install = true
deps = ataraxis-automation==9.0.2
depends =
    lint
    stubs
    {py312}-test
    coverage
    docs
    export
description = Builds and installs the project into its development mamba environment.
commands =
    automation-cli install-project --environment-name slvt_dev {posargs:}

[testenv:uninstall]
skip_install = true
deps = ataraxis-automation==9.0.2
description = Uninstalls the project from its development mamba environment.
commands =
    automation-cli uninstall-project --environment-name slvt_dev

[testenv:create]
skip_install = true
deps = ataraxis-automation==9.0.2
description =
    Creates the project's development mamba environment using the requested python version and installs runtime and
    development project dependencies extracted from the pyproject.toml file.
commands =
    automation-cli create-environment --environment-name slvt_dev --python-version 3.12 {posargs:}

[testenv:remove]
skip_install = true
deps = ataraxis-automation==9.0.2
description = Removes the project's development mamba environment.
commands =
    automation-cli remove-environment --environment-name slvt_dev

[testenv:provision]
skip_install = true
deps = ataraxis-automation==9.0.2
description = Provisions the project's development mamba environment by removing and (re)creating the environment.
commands =
    automation-cli provision-environment --environment-name slvt_dev --python-version 3.12 {posargs:}

[testenv:export]
skip_install = true
deps = ataraxis-automation==9.0.2
depends = uninstall
description =
    Exports the project's development mamba environment to the 'envs' project directory as a .yml file.
commands =
    automation-cli export-environment --environment-name slvt_dev

[testenv:import]
skip_install = true
deps = ataraxis-automation==9.0.2
description =
    Creates or updates the project's development mamba environment using the .yml file stored in the 'envs' project
    directory.
commands =
    automation-cli import-environment --environment-name slvt_dev
