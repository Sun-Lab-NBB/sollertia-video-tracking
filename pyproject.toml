# Defines the build system used for the project.
[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

# Project metadata section. Provides the general ID information about the project.
[project]
name = "sollertia-video-tracking"
version = "1.1.1rc3"
description = "Provides assets for designing and deploying DeepLabCut video tracking pipelines within the Sollertia platform."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# DeepLabCut 3.x supports Python 3.10-3.12 and the numpy 1.x series only, which is the binding constraint for this
# bridge. The library therefore targets the latest DeepLabCut-supported Python version, isolated from the numpy-2 /
# Python-3.14 environment used by the rest of the Sollertia stack.
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Ivan Kondratyev" },
]
maintainers = [
    { name = "Ivan Kondratyev", email = "ik278@cornell.edu" },
]

# The list of keywords that describe the project.
keywords = ["sollertia", "deeplabcut", "pose-estimation", "video-tracking"]

# Additional classifiers used by PIP to group repositories.
classifiers = [
    # Development status
    "Development Status :: 5 - Production/Stable",
    # Intended audience and project topic
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    # Supported Python Versions
    "Programming Language :: Python :: 3.12",
    # Supported Operating Systems
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    # Typing
    "Typing :: Typed",
]

# Runtime project dependencies.
dependencies = [
    # Pose Estimation (DeepLabCut 3.x and its PyTorch backend). DeepLabCut pins numpy<2 and supports Python 3.10-3.12,
    # so this bridge runs in its own environment and communicates with the rest of the Sollertia stack across the CLI
    # boundary rather than by direct import. torchvision is resolved transitively to match the installed torch build.
    #
    # This is pinned to an exact version rather than the usual major-version range because three subpackages override
    # DeepLabCut internals. The training subpackage reimplements the PyTorch train()/fit() orchestration and subclasses
    # the training runners to add mixed precision and DistributedDataParallel, the inference subpackage patches the
    # get_pose_inference_runner and get_detector_inference_runner builders, and the frame-extraction workers replace
    # KmeansbasedFrameselectioncv2 and attempt_to_add_video. The frame-extraction patches are plain assignments, so a
    # renamed upstream symbol silently no-ops. Those internals are private APIs with no stability guarantee within the
    # 3.x series, so an exact pin is required to keep the overrides valid. Bumping this version is a deliberate, tested
    # action: re-verify the overridden internals against the new release first.
    #
    # The [gui] extra is included because the refinement loop's manual labeling and label-refinement steps run in
    # DeepLabCut's napari-based GUI, which lives in this same isolated environment. It pulls in napari-deeplabcut and
    # a Qt binding (PySide6).
    "deeplabcut[gui]==3.0.1",
    "torch>=2,<3",

    # CUDA Kernel Compilation on Windows (the torch.compile inductor backend generates its GPU kernels through Triton,
    # which torch bundles itself on Linux and does not use on macOS, leaving Windows as the only platform that adds it)
    "triton-windows>=3.7,<4; sys_platform == 'win32'",

    # Numerical (pinned to the 1.x series required by DeepLabCut)
    "numpy>=1.26,<2",

    # Video Decoding (headless variant: the napari GUI does not use OpenCV's highgui, and installing the full
    # opencv-python alongside the headless build that transitive dependencies pull in would create a duplicate cv2)
    "opencv-python-headless>=4,<5",

    # Cross-Platform CPU Affinity (pins each extraction and inference worker to a disjoint core block on Linux and
    # Windows)
    "psutil>=7,<8",

    # Project Configuration Files
    "ruamel.yaml>=0.18,<1",

    # Command-Line Interface
    "click>=8,<9",

    # Columnar Output (the training evaluation step writes its per-snapshot metrics as a Sollertia polars feather;
    # pandas and pytables, used elsewhere to read DeepLabCut's HDF5 files, are provided transitively by DeepLabCut)
    "polars>=1,<2",
]

[project.urls]
Homepage = "https://github.com/Sun-Lab-NBB/sollertia-video-tracking"
Documentation = "https://sollertia-video-tracking-api-docs.netlify.app/"

# CLI interface. A single root command exposes the DeepLabCut bridge subcommands.
[project.scripts]
slvt = "sollertia_video_tracking.interfaces.entry_points:slvt_cli"

# Development dependencies (PEP 735). Not published to PyPI.
[dependency-groups]
dev = [
    # Tox
    "tox>=4,<5",
    "uv>=0,<1",
    "tox-uv>=1,<2",

    # Development Automation
    "ataraxis-automation>=9,<10",

    # Type Stubs (checked at development time only for dependencies that do not ship inline type information; pandas
    # is pulled in transitively by DeepLabCut)
    "pandas-stubs>=2,<3",
    "types-psutil>=7,<8",
]

# Specifies files that should not be included in the source-code distribution but are also not part of gitignore.
[tool.hatch.build.targets.sdist]
exclude = [".github", "recipe"]

# Specifies the library structure.
[tool.hatch.build.targets.wheel]
packages = ["src/sollertia_video_tracking"]

# Ruff Configuration.
[tool.ruff]
line-length = 120         # Deviates from the commonly used '80' standard.
indent-width = 4          # Same as black, indents are 4 spaces
target-version = "py312"  # Targets the lowest supported version of python
src = ["src"]             # The name of the root source code directory

# Excludes 'service' .py files, such as the sphinx configuration file, from linting.
extend-exclude = ["conf.py"]

# Checks for all potential violations and uses the exclusions below to target-disable specific ones.
lint.select = ["ALL"]

# General ignore directives
lint.ignore = [
    # Universal lint.ignore corpus. Present in every Ataraxis framework and Sollertia platform project.
    "W291",    # Conflicts with docstring formatting
    "ANN401",  # While suboptimal, ANY is a helpful type when used with caution
    "BLE001",  # Broad exception handling is necessary at library boundaries
    "C901",    # Sometimes complex functions are necessary
    "PLR0911", # Sometimes complex return graphs are necessary
    "PLR0912", # Sometimes complex functions are necessary
    "PLR0913", # Sometimes complex functions are necessary
    "PLR0915", # Sometimes functions with many statements are necessary
    "PLR0917", # PLR0913 already covers argument counts, and call sites pass keyword arguments
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "PT001",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "D107",    # __init__ is documented inside the main class docstring where applicable
    "D205",    # Bugs out for file descriptions
    "PLW0603", # While global statement usage is not ideal, it streamlines certain development patterns
    "TID252",  # Conflicts with the library import management strategy, which requires parent-relative imports
    "CPY001",  # The license is declared in the LICENSE file and the license and license-files metadata fields
]

# Additional formatting configurations
[tool.ruff.format]
quote-style = "double"             # Uses double quotes for strings
indent-style = "space"             # Uses space for indents
skip-magic-trailing-comma = false  # Like black, ignores trailing commas
line-ending = "auto"               # Automatically detects and standardizes line-ending character

# Docstrings and comments' line length
[tool.ruff.lint.pycodestyle]
max-doc-length = 120  # Maximum documentation line length, the same as code

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google"

# Additional, file-specific 'ignore' directives
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
]
"tests/**/*.py" = [
    # Shared test corpus. These entries are present in every Ataraxis framework and Sollertia platform project.
    "S101",    # Tests assert by design
    "PLR2004", # Expected values are clearer inline than as named constants
    "INP001",  # The test directory is not an importable package
    "SLF001",  # Tests exercise private module members directly
    "PT006",   # Parametrize argument names are declared as a single comma-separated string
    "ARG001",  # Pytest injects fixtures that individual tests may not reference
    "T201",    # Diagnostic prints are how a test reports intermediate state
    "D",       # Test names and inline comments carry the intent that docstrings carry in library code
    "ANN",     # Test functions and mock helpers do not need annotations

    # Project-specific
    "PT012",   # Expected-failure blocks wrap the context manager that the raising call runs inside
    "SIM117",  # Nesting the raises block inside the tested context manager keeps the two roles distinct
]

# Import sorting configurations
[tool.ruff.lint.isort]
case-sensitive = true              # Takes case into account when sorting imports
combine-as-imports = true          # Combines multiple "as" imports for the same package
force-wrap-aliases = true          # Wraps "as" imports so that each uses a separate line
force-sort-within-sections = true  # Forces "as" and "from" imports for the same package to be close
length-sort = true                 # Places shorter imports first

# Ignores unused variadic arguments, which are required by the DeepLabCut tqdm shim signature.
[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# MyPy configuration section.
[tool.mypy]
disallow_untyped_defs = true # Enforces function annotation
warn_unused_ignores = true   # Warns against using 'type: ignore' for packages with type stubs

exclude = [
    "sollertia-video-tracking-\\d+",  # Ignores the temporary directory created while building the sdist
    "venv.*/",                        # Ignores virtual environments
    "build/",                         # Ignores the sdist directory
    "dist/",                          # Ignores the wheel directory
    "docs/",                          # Ignores the sphinx / doxygen directory
    "stubs/",                         # Ignores stubs directory (stubgen output target)
    "recipe/",                        # Ignores recipe directory (grayskull output target)
    "tests/",                         # Ignores the test directory.
]

# DeepLabCut, and the sklearn and tqdm packages it pulls in, ship no type information, so their imports remain exempt
# from the missing-stub error. Neither DeepLabCut nor sklearn has a stub package on PyPI; tqdm does (types-tqdm), but
# this project does not carry it. Types for pandas (also pulled in transitively by DeepLabCut) and psutil are supplied
# by the pandas-stubs and types-psutil dev dependencies, while OpenCV, ruamel.yaml, and skimage ship a py.typed marker,
# which takes their imports out of that error whether or not the functions behind them carry annotations. All five are
# therefore resolved rather than ignored. The project's own code remains fully type-checked.
[[tool.mypy.overrides]]
module = [
    "deeplabcut.*",
    "sklearn.*",
    "tqdm",
]
ignore_missing_imports = true

# Pytest configuration. The import mode is declared here so that a bare 'pytest' invocation resolves test modules the
# same way the '{py312}-test' tox task does.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

# Enables parallel coverage collection across the frame-extraction, inference, and DDP training worker processes and the
# renderer thread, and lists the source files excluded from coverage measurement in full.
[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]

# Excludes the user-facing command-line and GUI entry points from coverage measurement. Per the project's testing
# policy, the interface layer (Click commands, the napari GUI launcher, and their argument wiring) is verified manually
# rather than by the automated suite, so its modules are not held to the coverage target.
omit = ["*/interfaces/*"]

# This is used by the 'test' tox tasks to aggregate coverage data produced during pytest runtimes.
[tool.coverage.paths]

# Maps coverage measured in site-packages to source files in src. The second pattern matches the POSIX virtual
# environment layout and the third matches the Windows layout, which omits the 'python*' path component. Both are
# required for the 'coverage' task to merge the data measured on either host into a single record per source file.
source = [
    "src/",
    ".tox/*/lib/python*/site-packages/",
    ".tox/*/Lib/site-packages/",
]

# Same as above, specifies the output directory for the coverage .html report
[tool.coverage.html]
directory = "reports/coverage_html"

# Specifies the coverage gate and additional ignore directives
[tool.coverage.report]
fail_under = 100     # Requires the test suite to cover every measured statement
show_missing = true  # Lists the statements missed by the test suite, so a failed check names the lines to cover
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __del__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
